<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 340px; margin: 0; padding: 16px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0d1420; color: #e6edf5;
  }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: linear-gradient(135deg, #06b6d4, #ec4899);
    display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #041018;
  }
  h1 { font-size: 14px; margin: 0; letter-spacing: .4px; }
  h1 span { color: #06b6d4; }
  .url {
    font-size: 11px; color: #8b9bb0; word-break: break-all;
    background: #111a29; border: 1px solid #1c2a3d; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, #06b6d4, #0891b2); color: #041018;
    font-weight: 700; font-size: 13px;
  }
  button:disabled { opacity: .5; cursor: wait; }
  .result { display: none; margin-top: 14px; }
  .result.on { display: block; }
  .banner {
    border-radius: 10px; padding: 14px; text-align: center; font-weight: 800;
    font-size: 18px; letter-spacing: 1px; margin-bottom: 10px;
    border: 1px solid #1c2a3d; background: #111a29;
  }
  .block { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.5); color: #ef4444; }
  .warn  { background: rgba(245,158,11,.15); border-color: rgba(245,158,11,.5); color: #f59e0b; }
  .allow { background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.5); color: #22c55e; }
  .meta { font-size: 12px; color: #8b9bb0; line-height: 1.6; }
  .meta b { color: #e6edf5; }
  .reason {
    margin-top: 10px; font-size: 12px; color: #c8d5e3; line-height: 1.5;
    background: #111a29; border-radius: 8px; padding: 10px; max-height: 110px; overflow: auto;
  }
  .err { display: none; margin-top: 12px; font-size: 12px; color: #fca5a5; }
  .err.on { display: block; }
  .loader { display: none; margin-top: 12px; font-size: 12px; color: #06b6d4; }
  .loader.on { display: block; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">VV</div>
    <h1>VERITAS <span>VISION</span></h1>
  </div>
  <div class="url" id="url">…</div>
  <button id="btn">Analyze this page</button>
  <div class="loader" id="loader">Capturing viewport and asking Gemini… retrying if busy (~1 min worst case)</div>
  <div class="err" id="err"></div>
  <div class="result" id="result">
    <div class="banner" id="banner">—</div>
    <div class="meta">
      Confidence: <b id="conf">—</b><br>
      Brand: <b id="brand">—</b><br>
      Time: <b id="ms">—</b>
    </div>
    <div class="reason" id="reason"></div>
  </div>
<script src="popup.js"></script>
</body>
</html>
