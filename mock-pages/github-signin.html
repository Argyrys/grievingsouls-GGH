<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in to GitHub</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: #0d1117; color: #e6edf3; }
  .wrap { max-width: 340px; margin: 70px auto; }
  .logo { font-size: 30px; text-align: center; margin-bottom: 26px; color: #e6edf3; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 28px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 16px; text-align: center; }
  label { display: block; font-size: 14px; margin-bottom: 6px; color: #e6edf3; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 10px; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; font-size: 15px; margin-bottom: 16px; }
  .btn { width: 100%; background: #238636; color: #fff; border: 0; padding: 11px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  .alt { margin-top: 16px; font-size: 13px; color: #8b949e; text-align: center; }
  .alert { background: #12261a; border: 1px solid #238636; color: #7ee787; padding: 9px 11px; border-radius: 6px; font-size: 13px; margin-bottom: 18px; text-align: center; }
  a { color: #58a6ff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">&#9679;&#9679;&#9679;</div>
    <div class="card">
      <div class="alert">Your session expired. Sign in again to keep access to your repositories.</div>
      <h1>Sign in to GitHub</h1>
      <label>Username or email address</label>
      <input type="text" placeholder="Username or email">
      <label>Password</label>
      <input type="password" placeholder="Password">
      <button class="btn">Sign in</button>
      <p class="alt">Forgot password? <a href="#">Reset it here</a></p>
    </div>
    <p class="alt">New to GitHub? <a href="#">Create an account</a></p>
  </div>
</body>
</html>
